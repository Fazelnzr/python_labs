[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "data-processor"
version = "0.2.0"
description = "Order data processing and functional decomposition module for the course 'Professional Python' (Laboratory Work No. 2, Variant 7)"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
data-processor = "data_processor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

